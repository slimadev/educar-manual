site_name: Manual do EDUCAR
site_description: Manual de uso do EDUCAR, ecrã a ecrã, para as escolas.
site_url: https://slimadev.github.io/educar-manual/
repo_url: https://github.com/slimadev/educar-manual
repo_name: slimadev/educar-manual
edit_uri: edit/main/docs/
docs_dir: docs
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  language: pt
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
plugins:
  - search:
      lang: pt
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Início: index.md
  - Primeiros passos:
      - Entrar no sistema: primeiros-passos/entrar.md
      - Avisos: primeiros-passos/avisos.md
      - A app: primeiros-passos/app.md
  - Perfis:
      - Direcção da escola: perfis/direccao.md
      - Finanças: perfis/financas.md
      - Secretaria: perfis/secretaria.md
      - Professor: perfis/professor.md
      - Aluno e encarregado: perfis/aluno-encarregado.md
  - Processos:
      - Exames, do princípio ao fim: processos/exames.md
      - O ano lectivo, do início ao fecho: processos/ano-lectivo.md
      - Pedido de documento: processos/pedido-de-documento.md
  - Menus:
      - "Configurações":
          - "Visão geral": menus/configuracoes/index.md
          - "Ano Académico": menus/configuracoes/ano-academico.md
          - "Calendário Académico": menus/configuracoes/calendario-academico.md
          - "Vagas por classe": menus/configuracoes/vagas-por-classe.md
          - "Etapas dos Documentos": menus/configuracoes/etapas-dos-documentos.md
          - "Modelos dos Documentos": menus/configuracoes/modelos-dos-documentos.md
          - "Avisos e Lembretes": menus/configuracoes/avisos-e-lembretes.md
          - "Períodos Leccionados": menus/configuracoes/periodos-leccionados.md
